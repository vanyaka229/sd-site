# Nginx для приёмника заявок SD Dance Studio.
#
# 443 занимает наш nginx, 80 остаётся у Caddy (панель studio-admin) — так и задумано.
# Сертификат выпускается по DNS-01 (см. acme-hook.py): для проверки порты не нужны вообще.
# Перед этим порт 443 освобождён у VPN: контейнер amnezia-xray остановлен и снят с автозапуска
# (как включить обратно — /root/VPS-README.md на сервере).
#
#   sudo cp nginx-api.sd-dance-st.ru.conf /etc/nginx/sites-available/api.sd-dance-st.ru
#   sudo ln -sf /etc/nginx/sites-available/api.sd-dance-st.ru /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # default слушает 80, а он занят Caddy
#   sudo nginx -t && sudo systemctl enable --now nginx
#
# Проверка: curl -s https://api.sd-dance-st.ru/health
# Ожидаемый ответ: {"ok":true,"bot":true,"chats":1,"uptime":...}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sd-dance-st.ru;

    ssl_certificate     /etc/letsencrypt/live/api.sd-dance-st.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sd-dance-st.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # Заявка меньше килобайта; 16k совпадает с лимитом внутри приёмника.
    client_max_body_size 16k;
    client_body_timeout 10s;

    access_log /var/log/nginx/api.sd-dance-st.ru.access.log;
    error_log  /var/log/nginx/api.sd-dance-st.ru.error.log;

    location = /tg {
        limit_except POST OPTIONS { deny all; }

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    12s;   # в приёмнике таймаут Telegram 10 с
        proxy_send_timeout    12s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }

    location / { return 404; }
}
